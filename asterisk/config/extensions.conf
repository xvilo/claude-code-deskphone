[from-phone]
; The daemon holds the deskphone ARI app open; Stasis falls through to a
; congestion tone when it isn't connected. Tones, not Playback(): the image
; ships no sound files.
exten => _1XX,1,Stasis(deskphone,inbound,${EXTEN})
 same => n,Answer()
 same => n,Playtones(congestion)
 same => n,Wait(3)
 same => n,Hangup()

exten => _X.,1,Answer()
 same => n,Playtones(congestion)
 same => n,Wait(3)
 same => n,Hangup()

[deskphone-test]
; Caller side of scripts/fake-call.ts: waits out the greeting and beep, then
; sends a tone loud enough to pass the VAD.
exten => fake,1,Answer()
 same => n,Wait(5)
 same => n,Playtones(440)
 same => n,Wait(2)
 same => n,StopPlaytones()
 same => n,Wait(4)
 same => n,Hangup()

[deskphone-mwi]
; Dialed by the daemon over ARI with the number of waiting replies as the
; extension. Sends the phone a message-summary NOTIFY, which the HT801 turns
; into a stutter dial tone.
exten => _X!,1,Set(CONTACT=${PJSIP_AOR(phone,contact)})
 same => n,GotoIf($["${CONTACT}" = ""]?done)
 same => n,PJSIPNotify(<${PJSIP_CONTACT(${CONTACT},uri)}>,&Event=message-summary&Content-Type=application/simple-message-summary&Content=Messages-Waiting: ${IF($[${EXTEN} > 0]?yes:no)}&Content=Voice-Message: ${EXTEN}/0&Content=)
 same => n(done),Hangup()
