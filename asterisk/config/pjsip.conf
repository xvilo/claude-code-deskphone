[global]
type=global
; PJSIPNotify to a URI (message waiting, see extensions.conf) needs this.
default_outbound_endpoint=phone

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:${SIP_PORT}
; The address phones must use, advertised in SIP and SDP instead of the
; container/pod IP. A hostname is resolved once at startup.
external_media_address=${EXTERNAL_IP}
external_signaling_address=${EXTERNAL_IP}
; Deliberately no local_net: Docker Desktop and Kubernetes can SNAT the phone
; into a private range, and a peer matching local_net is handed the
; unreachable container IP for its audio.

[phone]
type=endpoint
transport=transport-udp
context=from-phone
disallow=all
allow=ulaw,alaw
auth=phone
aors=phone
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
; Hang up calls whose audio stopped or never started, e.g. a lost BYE.
rtp_timeout=30

[phone]
type=auth
auth_type=userpass
username=phone
password=${PHONE_PASSWORD}

[phone]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
; The phone's contact is the laptop's address, which changes as it moves
; between networks; short registrations catch up within two minutes.
default_expiration=120
maximum_expiration=120
minimum_expiration=60
