; PJSIP objects come from pjsip.conf, plus in-memory ones the daemon creates
; over ARI for phones added with phone_device_add. The daemon re-adds those
; whenever it connects, so nothing here needs to persist.
[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=memory
auth=config,pjsip.conf,criteria=type=auth
auth=memory
aor=config,pjsip.conf,criteria=type=aor
aor=memory
