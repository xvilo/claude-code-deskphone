# SIP and RTP. Forward UDP 15060 and 10000-10019 from your router to this
# Service's external IP. With MetalLB, pin that IP with the
# metallb.io/loadBalancerIPs annotation so the port forward stays valid.
apiVersion: v1
kind: Service
metadata:
  name: asterisk
spec:
  type: LoadBalancer
  # Keeps the phone's real source address, which Asterisk's NAT handling needs.
  externalTrafficPolicy: Local
  selector:
    app: asterisk
  ports:
    - name: sip
      port: 15060
      protocol: UDP
    - name: rtp-10000
      port: 10000
      protocol: UDP
    - name: rtp-10001
      port: 10001
      protocol: UDP
    - name: rtp-10002
      port: 10002
      protocol: UDP
    - name: rtp-10003
      port: 10003
      protocol: UDP
    - name: rtp-10004
      port: 10004
      protocol: UDP
    - name: rtp-10005
      port: 10005
      protocol: UDP
    - name: rtp-10006
      port: 10006
      protocol: UDP
    - name: rtp-10007
      port: 10007
      protocol: UDP
    - name: rtp-10008
      port: 10008
      protocol: UDP
    - name: rtp-10009
      port: 10009
      protocol: UDP
    - name: rtp-10010
      port: 10010
      protocol: UDP
    - name: rtp-10011
      port: 10011
      protocol: UDP
    - name: rtp-10012
      port: 10012
      protocol: UDP
    - name: rtp-10013
      port: 10013
      protocol: UDP
    - name: rtp-10014
      port: 10014
      protocol: UDP
    - name: rtp-10015
      port: 10015
      protocol: UDP
    - name: rtp-10016
      port: 10016
      protocol: UDP
    - name: rtp-10017
      port: 10017
      protocol: UDP
    - name: rtp-10018
      port: 10018
      protocol: UDP
    - name: rtp-10019
      port: 10019
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: asterisk-http
spec:
  selector:
    app: asterisk
  ports:
    - name: http
      port: 8088
